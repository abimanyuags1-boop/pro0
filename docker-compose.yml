services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7
    container_name: oee_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Node.js + Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oee_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:80
      MONGO_URI: mongodb://mongodb:27017/oee_db
      TELEMETRY_INTERVAL_MS: 3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  # 3. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oee_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
